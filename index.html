                  </div>
                </div>

                <div className="mt-2 p-3 rounded-2xl bg-slate-50 border border-slate-100 text-xs text-slate-600 space-y-1">
                  <div className="flex justify-between font-bold text-slate-800">
                    <span>{userEmail}</span>
                    <span className="text-slate-400 font-medium">{refId}</span>
                  </div>
                  <p>Tek kullanımlık 6 haneli güvenlik kodu e-posta kutunuza iletilmiştir.</p>
                </div>

                {/* 3 Dakika Sayacı */}
                <div
                  className={`mt-4 p-3 rounded-2xl border transition ${
                    isCodeExpired ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-indigo-50/70 border-indigo-200 text-indigo-900'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-bold">
                    <span>{isCodeExpired ? '⚠️ Kodun Süresi Doldu!' : '⏳ Kod Geçerlilik Süresi:'}</span>
                    <span className="text-sm font-black">
                      {isCodeExpired
                        ? '00:00'
                        : `${String(Math.floor(validitySecondsLeft / 60)).padStart(2, '0')}:${String(validitySecondsLeft % 60).padStart(2, '0')}`}
                    </span>
                  </div>
                  <div className="w-full h-1.5 bg-slate-200 rounded-full mt-2 overflow-hidden">
                    <div
                      className={`h-full transition-all duration-1000 ${validitySecondsLeft < 30 ? 'bg-rose-500' : 'bg-indigo-600'}`}
                      style={{ width: `${(validitySecondsLeft / 180) * 100}%` }}
                    />
                  </div>
                </div>

                {/* 6 Haneli OTP Kutuları */}
                <div className="mt-5 space-y-2">
                  <label className="block text-xs font-bold text-slate-600 text-center">6 Haneli Doğrulama Kodunu Giriniz</label>
                  <div className="flex justify-center gap-2">
                    {otpDigits.map((digit, index) => (
                      <input
                        key={index}
                        id={`web-otp-${index}`}
                        type="text"
                        maxLength={1}
                        value={digit}
                        onChange={(e) => handleOtpChange(index, e.target.value)}
                        onKeyDown={(e) => handleOtpKeyDown(index, e)}
                        disabled={isCodeExpired || attemptsLeft <= 0 || isVerifying}
                        className="w-11 h-13 text-center text-xl font-black rounded-xl border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none bg-slate-50 transition"
                      />
                    ))}
                  </div>
                </div>

                {/* Hata Bildirimi */}
                <div className="mt-3 text-center">
                  <span className="text-[11px] font-semibold text-slate-500">
                    Kalan Deneme Hakkı: <strong className={attemptsLeft <= 2 ? 'text-rose-600' : 'text-slate-800'}>{attemptsLeft} / 5</strong>
                  </span>

                  {verifyError && (
                    <div className="mt-2 p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700">
                      {verifyError}
                    </div>
                  )}
                </div>

                {/* Onay Butonu */}
                <button
                  onClick={handleVerifySubmit}
                  disabled={isVerifying || isCodeExpired || attemptsLeft <= 0 || otpDigits.join('').length < 6}
                  className="mt-5 w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-indigo-600/20 text-sm"
                >
                  {isVerifying ? 'Kontrol Ediliyor...' : 'Doğrulamayı Tamamla'}
                </button>

                {/* Alt Aksiyonlar */}
                <div className="mt-4 flex items-center justify-between text-xs">
                  <a href="mailto:" target="_blank" className="text-indigo-600 hover:underline font-semibold">
                    📬 Posta Kutusunu Aç
                  </a>

                  {resendSecondsLeft > 0 ? (
                    <span className="text-slate-400 font-medium">Yeni Kod ({resendSecondsLeft}s)</span>
                  ) : (
                    <button onClick={handleSendVerificationCode} className="text-indigo-600 font-bold hover:underline">
                      Yeni Kod Gönder
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: STRATEJİK SINAV TAKVİMİ */}
          {showMilestonesModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 lg:p-8 shadow-2xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setShowMilestonesModal(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-lg font-bold"
                >
                  ✕
                </button>

                <h3 className="text-lg font-black text-slate-900">{EXAM_DATA[selectedExam].code} Stratejik Sınav Takvimi</h3>
                <p className="text-xs text-indigo-600 font-bold">{EXAM_DATA[selectedExam].displayName}</p>

                <div className="mt-6 space-y-4">
                  {EXAM_DATA[selectedExam].milestones.map((m, i) => (
                    <div key={i} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-start space-x-3.5">
                      <div className="w-7 h-7 rounded-full bg-indigo-600 text-white font-black text-xs flex items-center justify-center shrink-0">
                        {i + 1}
                      </div>
                      <div className="space-y-1">
                        <div className="flex items-center justify-between">
                          <h4 className="text-sm font-bold text-slate-900">{m.title}</h4>
                          <span className="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">
                            {m.dateRange}
                          </span>
                        </div>
                        <p className="text-xs text-slate-600">{m.description}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowMilestonesModal(false)}
                  className="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl text-xs transition"
                >
                  Kapat
                </button>
              </div>
            </div>
          )}

          {/* MODAL 5: GÜNÜN MOTİVASYONUNU DÜZENLE */}
          {showEditMotivationModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 lg:p-8 shadow-2xl border border-slate-100 relative">
                <button
                  onClick={() => setShowEditMotivationModal(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-lg font-bold"
                >
                  ✕
                </button>

                <h3 className="text-lg font-black text-slate-900">Günün Motivasyon Yazısını Belirle</h3>
                <p className="text-xs text-slate-500 font-medium">Öğrencilerin ana ekranında gösterilecek rehberlik mesajı</p>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setShowEditMotivationModal(false);
                  }}
                  className="mt-5 space-y-4"
                >
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Başlık / Slogan</label>
                    <input
                      type="text"
                      value={motivation.title}
                      onChange={(e) => setMotivation({ ...motivation, title: e.target.value, isAI: false })}
                      className="w-full text-sm font-semibold p-3 rounded-xl border border-slate-300 focus:border-indigo-600 outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Rehberlik & Güdüleme Metni</label>
                    <textarea
                      rows={4}
                      value={motivation.content}
                      onChange={(e) => setMotivation({ ...motivation, content: e.target.value, isAI: false })}
                      className="w-full text-sm p-3 rounded-xl border border-slate-300 focus:border-indigo-600 outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Koç İsmi</label>
                    <input
                      type="text"
                      value={motivation.authorName}
                      onChange={(e) => setMotivation({ ...motivation, authorName: e.target.value })}
                      className="w-full text-sm p-3 rounded-xl border border-slate-300 focus:border-indigo-600 outline-none"
                      required
                    />
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={handleGenerateAIMotivation}
                      className="flex-1 bg-purple-50 text-purple-700 hover:bg-purple-100 font-bold py-2.5 rounded-xl text-xs transition"
                    >
                      ✨ AI'dan Söz İste
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-indigo-600/20"
                    >
                      Yayınla & Kaydet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 6: YENİ DENEME EKLE */}
          {showAddExamModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 relative">
                <button onClick={() => setShowAddExamModal(false)} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-lg font-bold">
                  ✕
                </button>
                <h3 className="text-base font-black text-slate-900">Yeni Deneme Neti Ekle</h3>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const title = form.examTitle.value;
                    const turkce = parseFloat(form.turkce.value) || 0;
                    const matematik = parseFloat(form.matematik.value) || 0;
                    const fen = parseFloat(form.fen.value) || 0;
                    const sosyal = parseFloat(form.sosyal.value) || 0;
                    const totalNet = turkce + matematik + fen + sosyal;

                    setExams([{
                      id: Date.now().toString(),
                      title,
                      date: new Date().toISOString().split('T')[0],
                      turkce,
                      matematik,
                      fen,
                      sosyal,
                      totalNet
                    }, ...exams]);

                    setShowAddExamModal(false);
                  }}
                  className="mt-4 space-y-3"
                >
                  <input
                    name="examTitle"
                    type="text"
                    placeholder="Deneme Adı (Örn: 3D TYT Simülasyon)"
                    className="w-full text-xs font-semibold p-3 rounded-xl border border-slate-300 outline-none"
                    required
                  />

                  <div className="grid grid-cols-2 gap-2">
                    <input name="turkce" type="number" step="0.25" placeholder="Türkçe Net" className="p-2.5 text-xs rounded-xl border border-slate-300 outline-none" required />
                    <input name="matematik" type="number" step="0.25" placeholder="Matematik Net" className="p-2.5 text-xs rounded-xl border border-slate-300 outline-none" required />
                    <input name="fen" type="number" step="0.25" placeholder="Fen Net" className="p-2.5 text-xs rounded-xl border border-slate-300 outline-none" required />
                    <input name="sosyal" type="number" step="0.25" placeholder="Sosyal Net" className="p-2.5 text-xs rounded-xl border border-slate-300 outline-none" required />
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition"
                  >
                    Kaydet ve Listeye Ekle
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Uygulamayı DOM'a Bağla
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
